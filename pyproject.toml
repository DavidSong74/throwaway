[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parallel-ai-tournament"
version = "0.1.0"
description = "Compare independent Nosana edits in Daytona sandboxes"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
cloud = ["daytona[v0-sdk]==2.0.0a12"]
browser = ["playwright==1.65.2"]

[project.scripts]
ai-tournament = "tournament.__main__:main"

[tool.setuptools.packages.find]
include = ["tournament*"]
